<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>背書小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#000; --paper:#fff; --dot:rgba(0,0,0,.07); --sub:#555;
  --hit:#FFD400; --hurt:#FF2E2E; --ok:#14A44D;
  --c:#3A3A3A; --c-ink:#fff;          /* 目前科目色，由 JS 依科目覆寫 */
  --bd:3px solid var(--ink); --sh:5px 5px 0 var(--ink);
  --display:"Bangers","Noto Sans TC",Impact,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.65;font-weight:500;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:9px 9px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow-x:hidden;
}
#app{max-width:720px;margin:0 auto;padding:10px 16px 56px}
p{margin:.4em 0}
.sub{color:var(--sub);font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hit);outline-offset:2px}

/* ===== 共用元件 ===== */
.panel{background:var(--paper);border:var(--bd);border-radius:6px;box-shadow:var(--sh)}
.btn{
  appearance:none;border:var(--bd);background:var(--paper);border-radius:6px;box-shadow:4px 4px 0 var(--ink);
  font-size:16px;font-weight:900;padding:11px 12px;min-height:50px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.3;
  transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--c);color:var(--c-ink)}
.btn.hot{background:var(--hit)}
.btn:disabled{opacity:.35;pointer-events:none;box-shadow:none}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.btn.danger{color:var(--hurt)}
.icon{appearance:none;border:var(--bd);background:var(--paper);border-radius:50%;width:42px;height:42px;font-size:19px;font-weight:900;cursor:pointer;flex:none;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.icon:active{transform:translate(2px,2px);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.span2{grid-column:1/-1}
.tag{display:inline-block;font-size:13px;font-weight:900;padding:1px 10px;border:2px solid var(--ink);background:var(--c);color:var(--c-ink);transform:skew(-10deg)}
.tag>span{display:inline-block;transform:skew(10deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{appearance:none;flex:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.chip small{font-size:12px;opacity:.7;margin-left:4px}
.chip.on{background:var(--c);color:var(--c-ink)}
.chip:active{transform:translate(2px,2px);box-shadow:none}
.chip:focus-visible{outline:3px solid var(--c);outline-offset:2px}

header.top{display:flex;align-items:center;gap:10px;margin:6px 0 16px;min-height:46px}
header.top h1{margin:0;flex:1;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 首頁 ===== */
.logo{display:flex;align-items:flex-end;gap:10px;margin:8px 0 18px}
.logo h1{margin:0;flex:1;font-size:40px;line-height:1;font-weight:900;letter-spacing:.02em;transform:skew(-8deg);
  color:var(--paper);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--ink)}
.logo h1 small{display:block;font-size:14px;letter-spacing:.3em;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-bottom:6px}

.me{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:22px;background:var(--hit)}
.me .lv{font-family:var(--display);font-size:46px;line-height:.9;text-align:center;min-width:72px}
.me .lv small{display:block;font-family:"Noto Sans TC";font-size:12px;font-weight:900}
.me .info{flex:1;min-width:0}
.me .ttl{font-size:20px;font-weight:900;transform:skew(-6deg);display:inline-block}
.exp{height:14px;border:var(--bd);background:var(--paper);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.exp i{display:block;height:100%;background:var(--ink);transition:width .6s}
.me .nums{font-size:13px;font-weight:700}
.me .coins{display:inline-block;margin-top:4px;padding:1px 10px;border:var(--bd);background:#FFD400;color:#000;font-size:16px;font-weight:900}
.say .coin{display:inline-block;margin-left:8px;padding:0 8px;border:2px solid #000;background:#FFD400;color:#000;font-size:14px;font-weight:900;vertical-align:middle}
.say .coin.none{background:#ddd;color:#555}

.bank{position:relative;margin-bottom:22px;overflow:hidden}
.bank .band{position:absolute;left:0;top:0;bottom:0;width:58px;background:var(--c);border-right:var(--bd);
  display:flex;align-items:center;justify-content:center}
.bank .band b{writing-mode:vertical-rl;font-size:26px;font-weight:900;color:var(--c-ink);letter-spacing:.15em}
.bank .body{padding:14px 14px 14px 74px}
.bank h2{font-size:18px;margin:6px 0 2px;line-height:1.4;font-weight:900}
.bank .boss{font-size:14px;font-weight:700}
.bank .meta{font-size:14px;color:var(--sub);font-weight:700}
.bank .meta b.ng{color:var(--hurt)}
.bank .more{position:absolute;top:10px;right:10px;width:36px;height:36px;font-size:16px}
.bank .grid{gap:10px}
.rankmark{position:absolute;top:44px;right:12px;font-family:var(--display);font-size:34px;line-height:1;transform:rotate(12deg);
  color:var(--c);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.bank.revenge{--c:#FF2E2E;--c-ink:#fff}
.bank.revenge .band{background:repeating-linear-gradient(-45deg,var(--hurt) 0 10px,#000 10px 20px)}
.bank.revenge .band b{background:#000;color:#fff;padding:8px 3px}
.empty{text-align:center;padding:40px 8px}
.empty .big{font-size:24px;font-weight:900;transform:skew(-6deg)}

/* ===== 戰鬥（測驗） ===== */
.hud{padding:10px 12px;margin-bottom:16px}
.hud .row{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.hud .row+.row{margin-top:8px}
.hud .who{min-width:42px;font-family:var(--display);font-size:20px;letter-spacing:.04em}
.hpbar{flex:1;height:18px;border:var(--bd);background:#ddd;transform:skew(-12deg);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--c);transition:width .45s cubic-bezier(.3,1.6,.6,1)}
.hpbar.low i{background:var(--hurt)}
.hearts{flex:1;letter-spacing:2px;font-size:18px;line-height:1}
.hearts .lost{opacity:.18}
.hud .num{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.combo{font-family:var(--display);color:var(--hit);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);
  font-size:26px;line-height:1;white-space:nowrap;display:inline-block;transform:rotate(-6deg)}
.combo small{font-size:16px;margin-left:2px}
.combo.pop{animation:pop .35s}

.qcard{padding:16px;margin-bottom:16px;position:relative}
.qcard .src{display:inline-block;font-size:12px;font-weight:900;border:2px solid var(--ink);padding:0 8px;margin-bottom:8px}
.qtext{font-size:19px;font-weight:900;line-height:1.6}
.opts{display:grid;gap:12px}
.opt{appearance:none;width:100%;text-align:left;cursor:pointer;background:var(--paper);border:var(--bd);border-radius:6px;
  box-shadow:4px 4px 0 var(--ink);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:17px;font-weight:700;
  transition:transform .06s,box-shadow .06s}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt .lt{flex:none;width:30px;height:30px;border:var(--bd);display:grid;place-items:center;font-family:var(--display);font-size:19px;background:var(--paper);transform:skew(-10deg)}
.opt.ok{background:var(--hit)}
.opt.ok .lt{background:var(--ink);color:var(--hit)}
.opt.ng{background:var(--hurt);color:#fff}
.opt.ng .lt{background:var(--ink);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.fb{margin:18px 0 14px;padding:14px 16px;position:relative}
.fb .say{font-size:20px;font-weight:900;transform:skew(-6deg);display:inline-block;margin-bottom:4px}
.fb.ok{background:#FFF6BF}
.fb.ng{background:#FFE1E1}
.nextbtn{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5}   /* 手機：繼續攻擊固定在畫面底部，不用往下滑 */

/* 3D 舞台 */
.stage{position:sticky;top:env(safe-area-inset-top);z-index:6;height:260px;margin:0 -4px 14px;overflow:hidden;transition:height .25s;
  background:radial-gradient(circle at 50% 58%,rgba(255,255,255,.96) 0 30%,rgba(255,255,255,.55) 72%),var(--c)}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.12) 1.2px,transparent 1.5px);background-size:8px 8px;pointer-events:none}
.stage .cv{position:absolute;left:0;right:0;top:0;bottom:46px}
.stage .cv canvas{display:block}
.stage.compact{height:176px}
.stage.flat{height:auto;background:var(--paper)}
.stage.flat::before,.stage.flat .cv{display:none}
.stage .bar2{position:absolute;left:8px;right:14px;top:6px;z-index:3;display:flex;align-items:center;gap:8px}
.stage.flat .bar2{position:static;padding:6px 6px 0}
.stage .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:900}
.stage .name span{background:var(--ink);color:#fff;padding:2px 10px;display:inline-block;transform:skew(-10deg)}
.stage .icon{width:36px;height:36px;font-size:16px}
.stage .hud{position:absolute;left:0;right:0;bottom:0;z-index:3;margin:0;padding:7px 10px;border-top:var(--bd);background:var(--paper)}
.stage .hud .hearts{flex:none;font-size:15px;letter-spacing:1px}
.stage .bar2 .num{font-weight:900;font-size:14px;background:var(--ink);color:#fff;padding:1px 8px;transform:skew(-10deg)}
.stage .bar2 .combo{font-size:24px}
.stage.flat .hud{position:static;margin:6px;border:0}
.stage .hud .row+.row{margin-top:4px}
.stage .hud .hpbar{height:14px}
.stage .load{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--sub);font-size:14px}
/* 必殺技插畫 */
#cutin{position:fixed;inset:0;z-index:28;pointer-events:none;display:none;background:rgba(0,0,0,.6)}
#cutin.show{display:block;animation:fadeio 1.25s forwards}
#cutin .band{position:absolute;left:-10%;right:-10%;top:32%;padding:18px 0;background:var(--c);border-top:5px solid #000;border-bottom:5px solid #000;
  transform:rotate(-7deg);text-align:center;animation:slidein .35s cubic-bezier(.2,1.4,.5,1)}
#cutin .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 2px,transparent 2px 22px);animation:rush .3s linear infinite}
#cutin small{position:relative;display:block;font-size:16px;font-weight:900;color:#fff;letter-spacing:.4em}
#cutin b{position:relative;display:block;font-size:44px;font-weight:900;line-height:1.15;color:#FFD400;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000;transform:skew(-8deg)}
@keyframes slidein{from{transform:rotate(-7deg) translateX(-110%)}to{transform:rotate(-7deg) translateX(0)}}
@keyframes rush{from{background-position:0 0}to{background-position:-44px 0}}
@keyframes fadeio{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* 爪痕 */
#claw{position:fixed;inset:0;z-index:26;pointer-events:none;display:none}
#claw.show{display:block}
#claw i{position:absolute;left:12%;width:85%;height:12px;background:#FF2E2E;border:3px solid #000;border-radius:50%;transform-origin:left center;
  transform:rotate(32deg) scaleX(0);animation:claw .5s forwards}
#claw i:nth-child(1){top:22%}
#claw i:nth-child(2){top:32%;animation-delay:.05s}
#claw i:nth-child(3){top:42%;animation-delay:.1s}
@keyframes claw{0%{transform:rotate(32deg) scaleX(0);opacity:1}40%{transform:rotate(32deg) scaleX(1);opacity:1}100%{transform:rotate(32deg) scaleX(1);opacity:0}}

/* 擊中特效 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;display:none;align-items:flex-start;justify-content:center;padding-top:calc(70px + env(safe-area-inset-top))}
#fx.show{display:flex}
#fx.mini{justify-content:flex-end;padding-right:18px;padding-top:calc(54px + env(safe-area-inset-top))}
#fx.mini .lines{display:none}
#fx.mini .burst{padding:14px 18px}
#fx.mini .burst b{font-size:30px}
#fx.mini .burst span{font-size:15px}
#fx .lines{position:absolute;inset:-20%;
  background:repeating-conic-gradient(from 0deg,var(--fxc) 0 3deg,transparent 3deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 26%,#000 60%);mask:radial-gradient(circle,transparent 26%,#000 60%);
  opacity:.5;animation:spin .6s linear}
#fx .burst{position:relative;padding:26px 30px;background:var(--fxbg);border:4px solid var(--ink);
  clip-path:polygon(50% 0,61% 18%,82% 6%,78% 30%,100% 32%,84% 50%,100% 68%,77% 70%,82% 94%,61% 82%,50% 100%,39% 82%,18% 94%,22% 70%,0 68%,16% 50%,0 32%,22% 30%,18% 6%,39% 18%);
  text-align:center;animation:boom .55s cubic-bezier(.2,1.8,.5,1)}
#fx .burst b{display:block;font-family:var(--display);font-size:54px;line-height:1;letter-spacing:.03em;color:var(--fxt);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#fx .burst span{display:block;font-size:22px;font-weight:900;color:var(--ink);margin-top:2px}
#flash{position:fixed;inset:0;background:var(--hurt);pointer-events:none;z-index:24;opacity:0}
#flash.on{animation:flash .45s}
.shake{animation:shake .4s}

/* ===== 戰果 ===== */
.result{text-align:center;padding:22px 16px 18px;margin-top:6px;position:relative;overflow:hidden}
.result .lines{position:absolute;inset:-40%;background:repeating-conic-gradient(var(--c) 0 4deg,transparent 4deg 12deg);opacity:.18}
.stamp{position:relative;display:inline-grid;place-items:center;width:150px;height:150px;border:5px solid var(--ink);border-radius:50%;
  background:var(--c);transform:rotate(-12deg);box-shadow:6px 6px 0 var(--ink);animation:stamp .5s cubic-bezier(.2,1.6,.5,1)}
.stamp b{font-family:var(--display);font-size:104px;line-height:1;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;margin-top:10px}
.stamp.lose{background:#444}
.stamp.lose b{font-family:"Noto Sans TC";font-weight:900;font-size:46px;margin:0}
.result .line{position:relative;font-size:21px;font-weight:900;margin:18px 0 6px;transform:skew(-6deg)}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{border:var(--bd);padding:6px 4px;background:var(--paper)}
.stats b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.stats small{font-size:12px;font-weight:900}

/* 升級 */
#lvup{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px}
#lvup.show{display:flex}
#lvup .box{background:var(--hit);border:4px solid var(--ink);box-shadow:8px 8px 0 #000;padding:26px 22px;text-align:center;max-width:340px;width:100%;animation:boom .6s cubic-bezier(.2,1.8,.5,1)}
#lvup .box b{display:block;font-family:var(--display);font-size:60px;line-height:1}
#lvup .box .t{font-size:26px;font-weight:900;margin:6px 0 10px;transform:skew(-6deg)}
#lvup .unlock{font-size:17px;font-weight:900;margin-bottom:14px;line-height:1.6}
#lvup .unlock:empty{display:none}

/* ===== 作戰筆記（錯題重點） ===== */
.rv{padding:14px 16px;margin-bottom:20px}
.rv .src{display:inline-block;font-size:12px;font-weight:900;border:2px solid var(--ink);padding:0 8px;margin-bottom:8px}
.rv-q{font-weight:900;display:flex;gap:10px}
.num{flex:none;width:28px;height:28px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:18px;transform:skew(-10deg)}
.rv-a{margin:8px 0 0 38px;font-weight:900}
.rv-a mark{background:var(--hit);padding:0 4px}
.pt,.mn{margin-top:12px;padding:10px 12px;border:var(--bd)}
.pt{background:var(--paper)}
.pt b,.mn b{font-size:13px;font-weight:900;display:inline-block;transform:skew(-8deg)}
.mn{background:var(--hit);position:relative}
.pt p,.mn p{margin:2px 0 0;font-weight:700}

/* ===== 修練（單字卡） ===== */
.flip{perspective:1200px;cursor:pointer;margin-bottom:18px;user-select:none;-webkit-user-select:none}
.flip .inner{display:grid;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bd);border-radius:6px;box-shadow:var(--sh);
  background:var(--paper);min-height:340px;padding:28px 18px 20px;display:flex;flex-direction:column;justify-content:center;position:relative}
.face.back{transform:rotateY(180deg);background:#FFFBE0}
.face .hint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:var(--sub)}
.face .qtext{text-align:center}
.ans{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px}
.ans mark{background:var(--hit);padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.copts{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;text-align:left}
.copts li{border:2px solid var(--ink);padding:6px 10px;font-size:15px;font-weight:700;display:flex;gap:8px}
.copts li b{font-family:var(--display);font-size:17px;flex:none}
.bar{height:12px;border:var(--bd);background:var(--paper);margin-bottom:16px;transform:skew(-12deg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== 附圖 ===== */
.qimg{display:block;width:100%;padding:6px;margin:0 0 14px;border:var(--bd);background:#fff;cursor:zoom-in;position:relative}
.qimg img{display:block;width:100%;max-height:44vh;object-fit:contain}
.qimg::after{content:"🔍 點圖放大";position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:900;background:var(--ink);color:#fff;padding:2px 8px}
.qimg.broken{cursor:default} .qimg.broken img{display:none}
.qimg.broken::after{content:"圖片載入失敗（題庫要放在 GitHub 上）";position:static;display:block;text-align:center;background:none;color:var(--sub);padding:14px}
.rv .qimg{margin:10px 0 0}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:40;overflow:auto}
#zoom.show{display:block}
#zoom img{display:block;width:100%;min-height:100%;object-fit:contain;background:#fff}
#zoom .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#000;color:#fff;font-size:20px}

/* ===== 匯入 ===== */
textarea{width:100%;min-height:180px;margin-top:12px;padding:12px;border:var(--bd);background:var(--paper);color:var(--ink);font:16px/1.5 ui-monospace,Menlo,monospace}
.steps{padding-left:22px;font-size:15px;font-weight:700}
.err{color:var(--hurt);font-size:14px;font-weight:700;min-height:1em}
.sec-h{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
.sec-h h2{font-size:19px;margin:0;flex:1;font-weight:900;transform:skew(-6deg)}
.box{padding:4px 14px 12px;margin-bottom:24px}
.gh-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dashed var(--ink)}
.gh-row:last-of-type{border-bottom:0}
.gh-info{flex:1;min-width:0}

/* ===== 出題指令（給 AI 用） ===== */

{

/* ===== 科目：顏色、BOSS ===== */
const SUBJECTS = {

};
const DEFAULT_SUB = { c: '#3A3A3A', ink: '#fff', boss: '米克斯修練喵', kind: 'mix', ult: '知識爆裂拳' };
const subOf = s => SUBJECTS[(s || '').trim()] || DEFAULT_SUB;
const subVars = s => { const x = subOf(s); return `--c:${x.c};--c-ink:${x.ink}`; };

/* 科目篩選列：items 是科目名稱陣列，cur 是目前選的（'' = 全部） */
function subChips(items, cur, act) {
  const cnt = {}; items.forEach(n => cnt[n] = (cnt[n] || 0) + 1);
  const ord = Object.keys(SUBJECTS); const rk = n => { const i = ord.indexOf(n); return i < 0 ? 99 : i; };
  const names = Object.keys(cnt).sort((x, y) => rk(x) - rk(y)); if (names.length < 2) return '';
  const chip = (n, label, k) => `<button class="chip ${cur === n ? 'on' : ''}" style="${subVars(n)}" data-act="${act}" data-s="${esc(n)}" aria-pressed="${cur === n}">${esc(label)}<small>${k}</small></button>`;
  return `<div class="chips" role="group" aria-label="依科目篩選">${chip('', '全部', items.length)}${names.map(n => chip(n, n, cnt[n])).join('')}</div>`;
}
function setTheme(s) { const x = subOf(s); document.documentElement.style.setProperty('--c', x.c); document.documentElement.style.setProperty('--c-ink', x.ink); }

/* ===== 等級 ===== */
const TITLES = [[1, '見習生'], [3, '修練者'], [5, '戰士'], [8, '勇者'], [12, '英雄'], [16, '傳說'], [20, '神話']];
const needExp = lv => 100 + (lv - 1) * 50;
function levelOf(exp) {
  let lv = 1, rest = exp;
  while (rest >= needExp(lv)) { rest -= needExp(lv); lv++; }
  return { lv, cur: rest, need: needExp(lv) };
}
const titleOf = lv => TITLES.filter(t => lv >= t[0]).pop()[1];
const TIER_HIT = ['貓爪拳', '三連爪痕斬', '爪痕衝擊波', '天降落雷', '火焰爆炸', '龍捲旋風', '神話亂舞'];
const TIER_ULT = ['能量光束', '電光光束', '十字光束', '流星雨', '巨大能量球', '七彩光束', '終極奧義'];
const ULT_SUFFIX = ['', '・改', '・真', '・極', '・超', '・神', '・終極奧義'];

const myTier = () => tierOf(levelOf(db.exp).lv);

/* ===== 工具 ===== */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => esc(s).replace(/\n/g, '<br>');
const LETTER = 'ABCDEFGH';
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) | 0; return (h >>> 0).toString(36); }
let toastTimer;
function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function sheet(title, buttons) {

  box.innerHTML = `<h3>${esc(title)}</h3>` + buttons.map((b, i) =>

}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('已複製，貼給 AI 就好'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已複製'); } catch (_) { toast('複製失敗'); }
    ta.remove();

}
const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

/* ===== 音效（Web Audio 合成，不用音檔） ===== */
let actx = null;
function tone(freq, dur, type = 'square', when = 0, vol = .08) {
  if (!db.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const SFX = {
  hit: combo => { const b = 520 + Math.min(combo, 10) * 40; tone(b, .09); tone(b * 1.5, .16, 'square', .07); },
  hurt: () => { tone(180, .25, 'sawtooth', 0, .1); tone(110, .3, 'sawtooth', .1, .1); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'square', i * .11)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', i * .2, .12)),
  ult: () => {
    if (!db.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(1400, t + .7);
      g.gain.setValueAtTime(.06, t); g.gain.linearRampToValueAtTime(.1, t + .7); g.gain.exponentialRampToValueAtTime(.0001, t + .8);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .85);
    } catch (e) {}
    tone(90, .6, 'square', .85, .14); tone(60, .7, 'sawtooth', .9, .12); [784, 1047, 1319].forEach((f, i) => tone(f, .12, 'square', 1.1 + i * .07));
  },
  lvup: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'square', i * .08))
};

/* ===== 題庫格式檢查 ===== */
// 題目 id 沒指定時，用題目文字算出來；重新出題、順序改變，錯題紀錄都還對得上
function normalize(raw) {
  let o = raw;
  if (typeof o === 'string') {
    o = o.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    o = JSON.parse(o);
  }
  if (Array.isArray(o)) o = { questions: o };
  if (!o || !Array.isArray(o.questions) || !o.questions.length) throw new Error('找不到 questions 題目陣列');
  const title = String(o.title || '未命名題庫');
  const id = String(o.id || ('bank-' + hash(title)));
  const seen = new Set();
  const questions = o.questions.map((q, i) => {
    const text = q.q || q.question;
    const opts = q.options || q.choices;
    if (!text) throw new Error(`第 ${i + 1} 題沒有題目`);
    if (!Array.isArray(opts) || opts.length < 2) throw new Error(`第 ${i + 1} 題選項不足`);
    let a = q.answer;
    if (typeof a === 'string') {
      const t = a.trim();
      if (/^[A-Ha-h]$/.test(t)) a = t.toUpperCase().charCodeAt(0) - 65;
      else if (/^\d+$/.test(t)) a = +t;
      else a = opts.indexOf(t);
    }
    if (!Number.isInteger(a) || a < 0 || a >= opts.length) throw new Error(`第 ${i + 1} 題的 answer 不正確`);
    let qid = q.id ? String(q.id) : 'h' + hash(String(text).replace(/\s+/g, ''));
    while (seen.has(qid)) qid += '_';
    seen.add(qid);
    return {
      id: qid, q: String(text), options: opts.map(String), answer: a,
      explain: String(q.explain || ''), point: String(q.point || ''), mnemonic: String(q.mnemonic || ''),
      image: String(q.image || ''),
      lock: !!q.lock
    };
  });
  return { v: 2, id, title, subject: String(o.subject || ''), questions };
}

/* ===== 儲存 ===== */
const LS = 'beishu.v1';
let db = { banks: {}, order: [], wrong: {}, last: {}, best: {}, exp: 0, kills: 0, sound: true, coins: 0, qwin: {} };
function load() {
  try { const s = localStorage.getItem(LS); if (s) db = Object.assign(db, JSON.parse(s)); } catch (e) {}
  migrate();
}
// 舊版用 q1、q2… 順序編號，改成用題目文字的 id，錯題紀錄一起換過去
function migrate() {
  let changed = false;
  for (const id of Object.keys(db.banks)) {
    const b = db.banks[id];
    if (b.v === 2) continue;
    const oldIds = b.questions.map(q => q.id);
    b.questions.forEach(q => { if (/^q\d+(_\d+)?$/.test(q.id)) delete q.id; });
    try {
      const nb = normalize(b);
      const map = {}; oldIds.forEach((o, i) => { map[o] = nb.questions[i].id; });
      db.banks[id] = nb;
      db.wrong[id] = (db.wrong[id] || []).map(x => map[x]).filter(Boolean);
      changed = true;
    } catch (e) {}
  }
  if (changed) save();
}
function save() {
  try { localStorage.setItem(LS, JSON.stringify(db)); }
  catch (e) { toast('無法儲存，可能是私密瀏覽模式'); }
}
const wrongSet = id => new Set(db.wrong[id] || []);
function markWrong(bid, qid, isWrong) {
  const s = wrongSet(bid);
  isWrong ? s.add(qid) : s.delete(qid);
  db.wrong[bid] = [...s]; save();
}
function addBank(b) {
  const existed = !!db.banks[b.id];
  db.banks[b.id] = b;
  if (!existed) db.order.unshift(b.id);
  const ids = new Set(b.questions.map(q => q.id));
  db.wrong[b.id] = (db.wrong[b.id] || []).filter(x => ids.has(x));
  save();
  return existed;
}
// 加經驗值；有升級就回傳升級前的等級，沒升級回傳 0
function gainExp(n) {
  const before = levelOf(db.exp).lv;
  db.exp += n; save();
  return levelOf(db.exp).lv > before ? before : 0;
}

/* ===== 金幣：每題第 1 次答對 +2、第 2 次 +1、之後 0；整關通關每次 +5 ===== */
const COIN_Q = [2, 1], COIN_CLEAR = 5;
function earnQ(bid, qid) {
  const k = bid + '|' + qid, n = db.qwin[k] || 0, g = COIN_Q[n] || 0;
  db.qwin[k] = n + 1; db.coins += g; save();
  return g;
}

/* ===== 題目清單（可跨題庫）：ref = { b: 題庫id, q: 題目id } ===== */
function refsOf(bid, which) {
  const b = db.banks[bid]; if (!b) return [];
  const w = wrongSet(bid);
  return b.questions.filter(q => which !== 'wrong' || w.has(q.id)).map(q => ({ b: bid, q: q.id }));
}
const allWrongRefs = () => db.order.flatMap(id => refsOf(id, 'wrong'));
function resolve(refs) {
  return refs.map(r => {
    const b = db.banks[r.b], q = b && b.questions.find(x => x.id === r.q);
    return q ? { bid: r.b, bt: b.title, sub: b.subject, q } : null;
  }).filter(Boolean);
}
const toRefs = items => items.map(it => ({ b: it.bid, q: it.q.id }));
const isMulti = items => new Set(items.map(it => it.bid)).size > 1;
const srcTag = it => `<span class="src" style="${subVars(it.sub)}">${esc(it.bt)}</span>`;
const imgTag = q => q.image
  ? `<button class="qimg" data-act="zoom" data-src="${esc(q.image)}"><img src="${esc(q.image)}" alt="題目附圖" loading="lazy" onerror="this.parentNode.classList.add('broken')"></button>`

  document.getElementById('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { document.getElementById('raw').value = r.result; doImport(); };
    r.readAsText(f);
  };
  ghLoad(false);
}
function doImport() {
  const raw = document.getElementById('raw').value;
  const err = document.getElementById('err');
  if (!raw.trim()) { err.textContent = '請先貼上 JSON'; return; }
  try {
    const b = normalize(raw);
    const existed = addBank(b);
    home(); toast((existed ? '已更新：' : '已匯入：') + b.title);
  } catch (e) {
    err.textContent = '格式有問題：' + (e instanceof SyntaxError ? 'JSON 不完整或有多餘文字' : e.message);

}

/* ===== 從 GitHub 匯入：讀 banks/index.json（由 GitHub Actions 自動產生） ===== */
const INDEX_URL = 'banks/index.json';
let ghCache = null;
const bankSig = b => JSON.stringify([b.title, b.subject, b.questions]);
function ghStatus(b) {
  const l = db.banks[b.id];
  if (!l) return 'new';
  return bankSig(l) === bankSig(b) ? 'same' : 'update';
}
async function ghLoad(force) {
  const box = document.getElementById('gh'); if (!box) return;
  if (ghCache && !force) { renderGh(); return; }
  box.innerHTML = '<p class="sub">讀取中…</p>';
  try {
    const r = await fetch(INDEX_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) throw new Error('找不到題庫清單（banks/index.json），請確認 GitHub Actions 已執行完成');
    if (!r.ok) throw new Error('讀取題庫清單失敗（' + r.status + '）');
    const idx = await r.json();
    const files = (idx.files || []).filter(f => f.file);
    ghCache = await Promise.all(files.map(async f => {
      if (f.error) return { name: f.file, err: f.error };
      try {
        const res = await fetch('banks/' + encodeURIComponent(f.file) + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('讀取失敗（' + res.status + '）');
        return { name: f.file, bank: normalize(await res.text()) };
      } catch (e) {
        return { name: f.file, err: e instanceof SyntaxError ? 'JSON 格式錯誤' : (e.message || '讀取失敗') };
      }
    }));
    const key = x => x.bank ? (x.bank.subject + '\u0000' + x.bank.title) : '￿' + x.name;
    ghCache.sort((a, b) => key(a).localeCompare(key(b), 'zh-Hant'));
    renderGh();
  } catch (e) {
    ghCache = null;
    const msg = location.protocol === 'file:' ? '要放在 GitHub Pages 上開啟，才能讀取題庫清單'
      : (e instanceof SyntaxError ? '題庫清單格式錯誤' : (e.message && !/fetch/i.test(e.message) ? e.message : '讀取失敗，請確認網路連線'));
    if (document.getElementById('gh')) document.getElementById('gh').innerHTML = `<p class="err">${esc(msg)}</p>`;
  }
}
function renderGh() {
  const box = document.getElementById('gh'); if (!box || !ghCache) return;
  if (!ghCache.length) { box.innerHTML = '<p class="sub">banks 資料夾裡還沒有題庫</p>'; return; }
  const subs = ghCache.map(x => x.bank ? subName(x.bank.subject) : '格式錯誤');
  if (db.subGh && !subs.includes(db.subGh)) db.subGh = '';
  const cur = db.subGh || '', show = (x, i) => !cur || subs[i] === cur;
  const pend = ghCache.filter((x, i) => show(x, i) && x.bank && ghStatus(x.bank) !== 'same').length;
  box.innerHTML = subChips(subs, cur, 'subGh') + ghCache.map((x, i) => {
    if (!show(x, i)) return '';
    if (x.err) return `<div class="gh-row"><div class="gh-info"><b>${esc(x.name)}</b><div class="err">${esc(x.err)}</div></div></div>`;
    const b = x.bank, st = ghStatus(b);
    const btn = st === 'same' ? '<span class="gh-ok">✔ 已匯入</span>'
      : `<button class="btn sm ${st === 'new' ? 'go' : 'hot'}" data-act="ghImport" data-n="${i}">${st === 'new' ? '匯入' : '更新'}</button>`;
    return `<div class="gh-row" style="${subVars(b.subject)}"><div class="gh-info">
        ${b.subject ? `<span class="tag"><span>${esc(b.subject)}</span></span>` : ''}
        <div><b>${esc(b.title)}</b></div>
        <div class="sub">${b.questions.length} 題${st === 'update' ? '　GitHub 上有新版本' : ''}</div>
      </div>${btn}</div>`;
  }).join('') + (pend > 1 ? `<button class="btn go wide" data-act="ghImportAll" style="margin-top:12px">${cur ? '匯入／更新全部' + esc(cur) : '全部匯入／更新'}（${pend} 份）</button>` : '');
}

/* ===== 點陣 BOSS（three.js r128 舞台＋點陣貓貼圖，從 CDN 載入；失敗就只用 2D 特效） ===== */
const Boss3D = (() => {
  const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let T = null, loading = null, renderer = null, R = null;

      const s = document.createElement('script');
      s.src = CDN; s.async = true;
      s.onload = () => { T = window.THREE || null; res(!!T); };
      s.onerror = () => { loading = null; res(false); };
      document.head.appendChild(s);
      setTimeout(() => res(!!window.THREE), 10000);

    return loading;

  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const lerp = (a, b, t) => a + (b - a) * t;

  /* --- 點陣貓：72x72 格子，用形狀畫＋自動描邊＋簡單陰影，每次狀態改變才重畫 --- */
  const W = 72, GX = 4, GY = 7;                    // 貓本體畫在 64x64 範圍，上下左右留空間給配件
  const hexStr = v => typeof v === 'number' ? '#' + v.toString(16).padStart(6, '0') : v;
  function mix(c, to, k) {                         // 顏色往 to 混 k（0～1）
    const a = parseInt(c.slice(1), 16), b = parseInt(to.slice(1), 16);
    const ch = s => Math.round(((a >> s) & 255) * (1 - k) + ((b >> s) & 255) * k);
    return '#' + ((1 << 24) + (ch(16) << 16) + (ch(8) << 8) + ch(0)).toString(16).slice(1);
  }
  const dark = (c, k) => mix(c, '#000000', k), light = (c, k) => mix(c, '#FFFFFF', k);
  const buf = () => new Array(W * W).fill(null);
  const idx = (x, y) => { x = Math.floor(x) + GX; y = Math.floor(y) + GY; return x < 0 || y < 0 || x >= W || y >= W ? -1 : y * W + x; };
  const put = (b, x, y, c) => { const i = idx(x, y); if (i >= 0) b[i] = c; };
  const has = (b, x, y) => { const i = idx(x, y); return i >= 0 && !!b[i]; };
  function ell(b, cx, cy, rx, ry, c, sh, hi, clip) {          // 實心橢圓：右下陰影、左上亮面；clip＝只畫在已經有顏色的地方
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy > 1 || (clip && !has(b, x, y))) continue;
      const s = dx * .45 + dy;

  }
  const patch = (b, cx, cy, rx, ry, c) => ell(b, cx, cy, rx, ry, c, null, null, true);
  function tri(b, pts, c) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);

      const px = x + .5, py = y + .5;
      const s = pts.map((p, i) => { const q = pts[(i + 1) % 3]; return (q[0] - p[0]) * (py - p[1]) - (q[1] - p[1]) * (px - p[0]); });

      p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6;
      p.m.scale.setScalar(Math.max(.01, p.life / p.max) * p.size);
      return true;
    });
    R.shake = Math.max(0, R.shake - dt * 1.2);
    R.camera.position.x = Math.sin(R.t * 55) * R.shake * (R.hshake ? 2 : 1);
    R.camera.position.y = .7 + Math.cos(R.t * 47) * R.shake * .6 * (R.hshake ? .2 : 1);

  /* --- 特效零件 --- */
  const tween = (dur, fn, done, wait, keep) => R.tweens.push({ dur, fn, done, wait: wait || 0, t: 0, keep: !!keep });

  function burst(n, speed, pos, size, mats) {

      const life = .6 + Math.random() * .6, sz = (size || 1) * (.7 + Math.random() * .9);

  function beam(from, color, width, rainbow) {

    const g = new T.Group();
    const outerM = basic(color, { transparent: true, opacity: .9 });
    g.add(new T.Mesh(new T.CylinderGeometry(.5 * width, .5 * width, len, 16, 1, true), outerM));
    g.add(new T.Mesh(new T.CylinderGeometry(.22 * width, .22 * width, len, 12, 1, true), basic(0xffffff)));
    g.position.copy(from.clone().add(to).multiplyScalar(.5));
    g.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir.normalize());
    fade(g, .7, p => {
      const k = p < .2 ? p / .2 : p < .6 ? 1 : 1 - (p - .6) / .4;
      g.scale.set(Math.max(.01, k), 1, Math.max(.01, k)); outerM.opacity = .9 * k;

      const at = bossPos(); m.position.set(at.x, at.y + .5 - i * .4, at.z + 1.2); m.rotation.z = -.6;
      fade(m, .4, p => { m.scale.x = Math.min(1, p * 4); m.material.opacity = 1 - Math.max(0, p - .5) * 2; });

  }
  function shock(color) {

  }
  function thunder() {
    const g = new T.Group(), at = bossPos();
    const pts = [[0, 4.5], [.4, 3.6], [-.3, 2.7], [.35, 1.8], [-.2, .9], [0, 0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = new T.Vector3(at.x + pts[i][0], at.y + pts[i][1], at.z + .3), b2 = new T.Vector3(at.x + pts[i + 1][0], at.y + pts[i + 1][1], at.z + .3);
      const d = b2.clone().sub(a), m = new T.Mesh(new T.BoxGeometry(.14, d.length(), .05), basic(0xFFF27A));
      m.position.copy(a.clone().add(b2).multiplyScalar(.5)); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize()); g.add(m);

  function fire() {

    m.position.copy(bossPos());
    fade(m, .5, p => { m.scale.setScalar(.2 + p * 1.8); m.material.opacity = .85 * (1 - p); m.material.color.setHSL(.08 - p * .08, 1, .55); });

    }

  }
  function meteors(n) {

  function energyBall(color) {

  function tierHit(tier) {

  function ultFx(tier) {                   // 回傳打飛 BOSS 的時間點（秒）

      case 2: later(.6, () => { beam(L, 0xFFD400, 1.2); beam(Rt, 0xFF4FD8, 1.2); }); return .85;
      case 3: later(.45, () => meteors(6)); return 1.25;
      case 4: later(.45, () => energyBall()); return 1.2;
      case 5: later(.6, () => { beam(L, 0xFF0000, 1.6, true); R.flash = 1.6; }); return .9;
      default:
        later(.45, () => meteors(5));
        later(1.0, () => { beam(L, 0xFFD400, 1.3, true); beam(Rt, 0x55E0FF, 1.3, true); });
        later(1.3, () => energyBall(0xFFD400));
        return 2.05;
    }
  }

  return {
    load, start, stop, resize,
    available: () => !!T,
    running: () => !!R,
    _debug: () => R,
    _pose: n => setPose(n),
    hit1(final, tier) {
      if (!reset()) return 0;
      R.flash = 1; R.shake = .08; R.hurt = .7; burst(8, 4); tierHit(tier || 0);

    hit2(final, tier) {

      R.flash = 1; R.shake = .16; R.hurt = 1; burst(18, 5.5); tierHit(tier || 0);
      tween(.85, p => {
        R.off.y = 2 * 4 * p * (1 - p); R.off.ry = Math.PI * 2 * easeOut(p);
        R.off.z = -.8 * Math.sin(Math.PI * p); R.off.rz = .5 * Math.sin(Math.PI * p);

    },
    ult(final, tier) {

      const flyAt = ultFx(tier || 0);
      tween(.2, p => { R.off.s = 1 + .15 * Math.sin(p * Math.PI * 6); }, null, .45);

      }, flyAt);

    },
    // 答錯：BOSS 反擊。回傳 { name, claw }
    attack() {
      if (!reset()) return null;

        R.mad = .9;
        tween(.7, p => { R.ex.punch = Math.max(0, Math.sin(p * Math.PI * 4)) * .9; R.off.z = .6 * Math.sin(Math.PI * p); });
        later(.18, () => { R.shake = .18; }); later(.45, () => { R.shake = .2; });

      }
      if (kind === 'pounce') {

      R.angry = on ? 1 : 0;
      if (!R.dizzy) setPose(on ? 'puff' : R.basePose);
    }
  };
})();

/* ===== 戰鬥（測驗） ===== */
let S = null, C = null;
const SET = { last: null, all: null, rev: null };
const HIT_WORDS = [['HIT!', '會心一擊！'], ['NICE!', '漂亮命中！'], ['BOOM!', '直擊要害！'], ['YES!', '答對了！']];
const COMBO_WORDS = [[3, 'COMBO!', '連擊發動！'], [5, 'RUSH!', '勢不可擋！'], [8, 'MAX!', '無雙狀態！'], [12, 'GOD!', '已經沒人擋得住你！']];
const CAT_ATTACKS = [{ name: '毛毛貓貓拳', claw: true }, { name: '毛毛飛撲', claw: true }, { name: '毛毛甩尾鞭' }, { name: '毛毛哈氣', hiss: true }];
function showClaw() {

// opt: { title, boss, sub, recordBid }
function startQuiz(refs, opt) {
  const items = resolve(refs);
  if (!items.length) { toast('沒有可以挑戰的題目'); return; }
  const n = items.length, maxHp = Math.min(8, Math.max(3, Math.ceil(n * .3)));
  S = {
    title: opt.title, boss: opt.boss, sub: opt.sub, recordBid: opt.recordBid || null, multi: isMulti(items),
    i: 0, correct: 0, wrong: [], answered: false, combo: 0, maxCombo: 0, exp: 0, coins: 0,
    n, bossHp: n, hp: maxHp, maxHp,

  stage.innerHTML = `<div class="cv"></div><div class="load">BOSS 登場中…</div>
    <div class="bar2"><button class="icon" data-act="quitQuiz" aria-label="撤退">✕</button><div class="name"><span>${esc(S.boss)}</span></div><span class="cb"></span><span class="num qn"></span></div>
    <div class="hud" id="hud"></div>`;

  const mine = S;

    if (started) { stage.querySelector('.load').remove(); Boss3D.setAngry(S.bossHp / S.n <= .25); }

}

  el.innerHTML = `<div class="row"><span class="who">BOSS</span><div class="hpbar ${bp <= 25 ? 'low' : ''}"><i style="width:${bp}%"></i></div><span class="num">${S.bossHp}/${S.n}</span>

function pick(k) {
  if (!S || S.answered) return;
  S.answered = true;
  const it = S.items[S.i], ok = it.order[k] === it.q.answer;
  const right = it.order.indexOf(it.q.answer);

    bt.disabled = true;

  });

    S.exp += 10 + Math.min(S.combo, 10) * 2;
    const lastQ = S.i === S.items.length - 1, final = S.bossHp <= 0 || lastQ, move = S.combo % 3 === 0 ? 'ult' : S.combo % 3 === 2 ? 'hit2' : 'hit1';
    const cw = COMBO_WORDS.filter(c => S.combo >= c[0]).pop();
    const w = move === 'hit2' ? ['DOUBLE!', '二連擊！'] : cw ? [cw[1], cw[2]] : pickOne(HIT_WORDS);

  } else {
    S.wrong.push({ b: it.bid, q: it.q.id }); S.combo = 0; S.hp--;

    showFx(atk.hiss ? 'HISS!' : pickOne(['OUCH!', 'ARGH!', 'MEOW!']), atk.name + '！', false); SFX.hurt(); vibrate([60, 40, 60]);

    const fl = document.getElementById('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');

  }
  updateHud();
  const done = S.hp <= 0 || S.i === S.items.length - 1;
  const fb = document.getElementById('fb');

      <div class="say">${esc(say)}${gain > 0 ? `<span class="coin">💰 +${gain}</span>` : gain === 0 ? '<span class="coin none">💰 已領過</span>' : ''}</div>

    </div>
    <button class="btn go wide nextbtn" data-act="next">${done ? '看戰果' : '繼續攻擊！'}</button>`;
  setTimeout(() => fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 250);
}
function next() {
  if (!S) return;
  if (S.hp > 0 && S.i < S.items.length - 1) { S.i++; renderQ(); } else result();
}
const RANK_ORDER = ['C', 'B', 'A', 'S'];
function result() {
  Boss3D.stop();

  const n = S.n, win = S.hp > 0, pct = S.correct / n;
  const rank = !win ? null : pct >= 1 ? 'S' : pct >= .85 ? 'A' : pct >= .7 ? 'B' : 'C';
  const LINES = {
    S: '完美擊破！這一課已經被你征服了！', A: '超強！只差一點就完美了！',
    B: '打贏了！把錯題補起來，下次拿 S！', C: '險勝！先看作戰筆記，再挑戰一次！'
  };
  let exp = S.exp;
  if (win) { exp += 30 + (rank === 'S' ? 30 : 0); db.kills++; }
  const clear = win && S.recordBid ? COIN_CLEAR : 0;
  if (clear) { db.coins += clear; S.coins += clear; save(); }
  if (win && S.recordBid) {
    const old = db.best[S.recordBid];
    if (!old || RANK_ORDER.indexOf(rank) > RANK_ORDER.indexOf(old)) db.best[S.recordBid] = rank;
    db.last[S.recordBid] = { score: S.correct, total: n, at: Date.now() };
  }
  const up = gainExp(exp);
  SET.last = { title: S.title, boss: S.boss, sub: S.sub, refs: S.wrong.slice() };
  const answered = S.i + 1, wn = S.wrong.length;
  app.innerHTML = `<header class="top"><h1>${esc(S.boss)}｜戰果</h1></header>
    <section class="panel result">
      <div class="lines"></div>
      <div class="stamp ${win ? '' : 'lose'}"><b>${win ? rank : '敗北'}</b></div>
      <div class="line">${win ? LINES[rank] : '別放棄！看完作戰筆記，再來討回這一戰！'}</div>
      <div class="stats">
        <div><b>${S.correct}/${answered}</b><small>答對</small></div>
        <div><b>${S.maxCombo}</b><small>最大連擊</small></div>
        <div><b>+${exp}</b><small>EXP</small></div>
      </div>
      <div class="line">💰 本場 +${S.coins} 元${clear ? `（含通關 +${clear}）` : ''}　目前共 ${db.coins} 元</div>
    </section>
    <div class="grid">
      ${wn ? `<button class="btn go span2" data-act="reviewLast">看作戰筆記（${wn} 題錯題）</button>
        <button class="btn" data-act="cardsLast">錯題修練卡</button>
        <button class="btn" data-act="quizLast">錯題再戰</button>` : ''}
      ${!win ? `<button class="btn ${wn ? '' : 'go'} span2" data-act="retry">重新挑戰</button>` : ''}
      ${win && !wn ? `<button class="btn go" data-act="cardsAllLast">修練卡複習</button>` : ''}
      <button class="btn ${win && !wn ? '' : 'span2'}" data-act="home">回基地</button>
    </div>`;
  SET.retry = { refs: SET.all, title: S.title, boss: S.boss, sub: S.sub, recordBid: S.recordBid };
  S = null;
  window.scrollTo(0, 0);
  if (!win) setTimeout(SFX.lose, 200);
  if (up) setTimeout(() => showLevelUp(up), 1100);
}
function showLevelUp(before) {
  const L = levelOf(db.exp), box = document.getElementById('lvup'), t = tierOf(L.lv);
  box.querySelector('.t').textContent = `Lv.${L.lv}　${titleOf(L.lv)}`;
  box.querySelector('.unlock').innerHTML = before && tierOf(before) < t
    ? `新招式解鎖！<br>攻擊：${TIER_HIT[t]}<br>大招：${TIER_ULT[t]}` : '';
  box.classList.add('show'); SFX.lvup(); vibrate([40, 30, 40, 30, 80]);
}

/* ===== 作戰筆記（錯題重點） ===== */
function review(refs, title) {
  Boss3D.stop();
  const items = resolve(refs), multi = isMulti(items);
  SET.rev = { title, refs: toRefs(items), sub: multi ? '' : (items[0] || {}).sub };
  setTheme(SET.rev.sub);
  let h = `<header class="top"><button class="icon" data-act="home" aria-label="返回">‹</button><h1>作戰筆記｜${esc(title)}</h1></header>`;
  if (!items.length) h += `<div class="empty"><p class="big">沒有錯題，全部擊破！</p></div>`;
  items.forEach((it, i) => {
    const q = it.q;
    h += `<article class="panel rv">
      ${multi ? srcTag(it) : ''}
      <div class="rv-q"><span class="num">${i + 1}</span><span>${fmt(q.q)}</span></div>
      ${imgTag(q)}
      <div class="rv-a">✔ <mark>${fmt(q.options[q.answer])}</mark></div>
      ${q.point ? `<div class="pt"><b>重點</b><p>${fmt(q.point)}</p></div>` : ''}
      ${q.mnemonic ? `<div class="mn"><b>💡 必殺口訣</b><p>${fmt(q.mnemonic)}</p></div>` : ''}
    </article>`;
  });
  if (items.length) h += `<div class="grid"><button class="btn" data-act="cardsReview">修練這些</button><button class="btn go" data-act="quizReview">馬上再戰</button></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

/* ===== 修練（單字卡） ===== */
function cards(refs) {
  Boss3D.stop();
  const items = resolve(refs);
  if (!items.length) { toast('沒有卡片'); return; }
  C = { items: shuffle(items).map(it => ({ ...it, order: it.q.lock ? it.q.options.map((_, i) => i) : shuffle(it.q.options.map((_, i) => i)) })), multi: isMulti(items), i: 0 };
  setTheme(isMulti(items) ? '' : items[0].sub);
  renderCard();
}
function renderCard() {
  const it = C.items[C.i], q = it.q, n = C.items.length;
  app.innerHTML = `<header class="top"><button class="icon" data-act="home" aria-label="離開">✕</button>
      <h1>修練中　${C.i + 1} / ${n}</h1></header>
    <div class="bar"><i style="width:${(C.i + 1) / n * 100}%"></i></div>
    <div class="flip" id="card" data-act="flip"><div class="inner">
      <div class="face front"><div class="hint">點一下翻面，左右滑換張</div>
        ${C.multi ? `<div style="text-align:center">${srcTag(it)}</div>` : ''}
        ${imgTag(q)}
        <div class="qtext">${fmt(q.q)}</div>
        ${needOpts(q) ? optList(q, it.order) : ''}</div>
      <div class="face back">
        <div class="ans"><mark>${needOpts(q) ? LETTER[it.order.indexOf(q.answer)] + '　' : ''}${fmt(q.options[q.answer])}</mark></div>
        ${q.point ? `<div class="pt"><b>重點</b><p>${fmt(q.point)}</p></div>` : ''}
        ${q.mnemonic ? `<div class="mn"><b>💡 必殺口訣</b><p>${fmt(q.mnemonic)}</p></div>` : ''}
      </div>
    </div></div>
    <div class="nav">
      <button class="btn" data-act="cprev" ${C.i ? '' : 'disabled'}>‹ 上一張</button>
      <button class="btn go" data-act="cnext">${C.i === n - 1 ? '修練完成' : '下一張 ›'}</button>
    </div>`;
  const card = document.getElementById('card');
  let x0 = null, y0 = null;
  card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  card.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      card.dataset.swiped = '1';
      dx < 0 ? cnext() : cprev();
    }
  });
}
function cnext() {
  if (!C) return;
  if (C.i < C.items.length - 1) { C.i++; renderCard(); return; }
  const n = C.items.length, gain = Math.min(30, 5 + n * 2), up = gainExp(gain);
  home(); toast(`修練完成！EXP +${gain}`);
  if (up) setTimeout(() => showLevelUp(up), 400);
}
function cprev() { if (C && C.i > 0) { C.i--; renderCard(); } }

/* ===== 事件 ===== */
const bankOf = id => db.banks[id] || {};
const quizOpt = (id, extra) => { const b = bankOf(id); return { title: b.title + (extra || ''), boss: subOf(b.subject).boss, sub: b.subject }; };
const REVENGE = { title: '全部錯題', boss: '幽靈怨念喵', sub: '錯題' };
const ACT = {
  home, importView, doImport,
  copyPrompt: () => copyText(PROMPT),
  loadSample: () => { addBank(normalize(SAMPLE)); home(); toast('已加入示範題庫'); },
  toggleSound: () => { db.sound = !db.sound; save(); home(); if (db.sound) SFX.hit(1); },
  quiz: d => d.mode === 'wrong'
    ? startQuiz(refsOf(d.id, 'wrong'), quizOpt(d.id, '・錯題'))
    : startQuiz(refsOf(d.id), { ...quizOpt(d.id), recordBid: d.id }),
  cards: d => cards(refsOf(d.id)),
  review: d => review(refsOf(d.id, 'wrong'), bankOf(d.id).title),
  allQuiz: () => startQuiz(allWrongRefs(), REVENGE),
  allReview: () => review(allWrongRefs(), '全部錯題'),
  allCards: () => cards(allWrongRefs()),
  pick: d => pick(+d.k),
  next,
  quitQuiz: () => { if (!S || S.i === 0 || confirm('要撤退嗎？已作答的錯題會保留。')) { S = null; home(); } },
  reviewLast: () => review(SET.last.refs, SET.last.title),
  cardsLast: () => cards(SET.last.refs),
  quizLast: () => startQuiz(SET.last.refs, { title: SET.last.title.replace(/・錯題$/, '') + '・錯題', boss: SET.last.boss, sub: SET.last.sub }),
  retry: () => startQuiz(SET.retry.refs, SET.retry),
  cardsAllLast: () => cards(SET.all),
  cardsReview: () => cards(SET.rev.refs),
  quizReview: () => startQuiz(SET.rev.refs, SET.rev.title === '全部錯題' ? REVENGE
    : { title: SET.rev.title.replace(/・錯題$/, '') + '・錯題', boss: subOf(SET.rev.sub).boss, sub: SET.rev.sub }),
  flip: (d, el) => { if (el.dataset.swiped) { delete el.dataset.swiped; return; } el.classList.toggle('on'); },
  cnext, cprev,
  zoom: (d, el) => {
    if (el.classList.contains('broken')) return;
    const z = document.getElementById('zoom'); z.querySelector('img').src = d.src; z.classList.add('show');
  },
  ghRefresh: () => ghLoad(true),
  subHome: d => { db.subHome = d.s; save(); home(); },
  subGh: d => { db.subGh = d.s; save(); renderGh(); },
  ghImport: d => {
    const x = ghCache && ghCache[+d.n]; if (!x || !x.bank) return;
    const ex = addBank(x.bank); renderGh(); toast((ex ? '已更新：' : '已匯入：') + x.bank.title);
  },
  ghImportAll: () => {
    let n = 0;
    const cur = db.subGh || '';
    (ghCache || []).forEach(x => { if (x.bank && (!cur || subName(x.bank.subject) === cur) && ghStatus(x.bank) !== 'same') { addBank(x.bank); n++; } });
    renderGh(); toast(`已匯入／更新 ${n} 份題庫`);
  },
  bankMenu: d => {
    const b = db.banks[d.id]; if (!b) return;
    sheet(b.title, [
      { text: '清除錯題紀錄', fn: () => { db.wrong[d.id] = []; delete db.last[d.id]; save(); home(); toast('已清除'); } },
      { text: '重置最佳評級', fn: () => { delete db.best[d.id]; save(); home(); toast('已重置'); } },
      { text: '刪除這個題庫', cls: 'danger', fn: () => {
        if (!confirm('確定刪除「' + b.title + '」？')) return;
        delete db.banks[d.id]; delete db.wrong[d.id]; delete db.last[d.id]; delete db.best[d.id];
        db.order = db.order.filter(x => x !== d.id); save(); home(); toast('已刪除');
      } }
    ]);
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.getElementById('zoom').querySelector('.x').addEventListener('click', () => document.getElementById('zoom').classList.remove('show'));
document.getElementById('lvup').addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.id === 'lvup') e.currentTarget.classList.remove('show'); });

window.addEventListener('scroll', () => {
  if (!S || !S.stageEl) return;                  // 用兩個門檻避免縮放時來回跳動
  const y = window.scrollY, c = S.stageEl.classList;
  if (y > 90 && !c.contains('compact')) c.add('compact');
  else if (y < 8 && c.contains('compact')) c.remove('compact');
}, { passive: true });

/* ===== 啟動：支援 ?bank=banks/xxx.json ===== */
load();
home();
const bankUrl = new URLSearchParams(location.search).get('bank');
if (bankUrl) {
  fetch(bankUrl, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => { const b = normalize(t); const existed = addBank(b); home(); toast((existed ? '已更新：' : '已載入：') + b.title); })
    .catch(() => toast('題庫載入失敗，請確認檔案路徑'));
}
})();
// 手機禁止縮放（iOS Safari 會忽略 viewport 的 user-scalable，另外擋手勢）
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// 大圖：點一下放大 200%（可上下左右捲動），再點一下還原；關閉時還原
(() => {
  const z = document.getElementById('zoom'), zi = z.querySelector('img');
  zi.addEventListener('click', () => zi.classList.toggle('big'));
  z.querySelector('.x').addEventListener('click', () => zi.classList.remove('big'));
})();
</script>
</body>
</html>
