# 每次 push 到 main：自動產生 banks/index.json（題庫清單），再部署 GitHub Pages
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 產生題庫清單 banks/index.json
        run: |
          node -e '
          const fs = require("fs");
          const files = fs.existsSync("banks") ? fs.readdirSync("banks") : [];
          const list = [];
          for (const f of files.filter(f => f.endsWith(".json") && f !== "index.json").sort()) {
            try {
              const j = JSON.parse(fs.readFileSync("banks/" + f, "utf8"));
              list.push({ file: f, id: j.id || "", title: j.title || f, subject: j.subject || "", count: (j.questions || []).length });
            } catch (e) {
              list.push({ file: f, error: "JSON 格式錯誤" });
              console.log("::warning::" + f + " JSON 格式錯誤");
            }
          }
          fs.mkdirSync("banks", { recursive: true });
          fs.writeFileSync("banks/index.json", JSON.stringify({ updated: new Date().toISOString(), files: list }, null, 2));
          console.log("共 " + list.length + " 份題庫");
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
